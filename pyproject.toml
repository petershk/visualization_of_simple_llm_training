[project]
name = "visualization-of-simple-llm-training"
version = "0.1.0"
description = "Inside the Learning Machine: an interactive PyTorch exhibit showing how a GPT learns to predict words"
readme = "README.md"
authors = [
    { name = "Hermann Peterscheck", email = "petershk@yahoo.com" }
]
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.2",
    "torch>=2.11.0",
]

[tool.uv]
# A single script, not an installable package.
package = false

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu128"
